<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wRENcHIRIANs — Campus Issue Reporting (Student Portal)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/wrenchirians-logo.png" />

  <!-- App Styles & Custom 2D Blueprint Campus Engine CSS -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="student-portal.css" />
  <link rel="stylesheet" href="campus-map-2d.css" />
</head>
<body>

<div id="app-shell">

  <!-- ══════════════════ HEADER ══════════════════ -->
  <header id="app-header" role="banner">
    <div class="header-brand">
      <img src="assets/wrenchirians-logo.png" alt="wRENcHIRIANs Logo" class="header-logo-img" />
      <div>
        <h1>wRENcHIRIANs</h1>
        <div class="header-sub">Student Portal — ISAT U</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <a href="dashboard.html" class="dash-link-btn" title="Open Maintenance Dispatch Board">
        🛠️ <span class="hide-mobile">Dashboard</span>
      </a>
      <div class="header-time hide-mobile" aria-live="polite">
        <span id="hdr-time" style="font-size:13px;font-weight:700;"></span>
        <span id="hdr-date" style="font-size:10px;opacity:.7;"></span>
      </div>
    </div>
  </header>

  <!-- Mobile Segmented View Switcher (Visible only on phone <= 768px) -->
  <div class="mobile-tab-bar" id="mobile-tab-bar" role="tablist" aria-label="View switcher">
    <button type="button" class="mobile-tab-btn active" id="tab-btn-form" onclick="switchMobileView('form')">
      📋 Form
    </button>
    <button type="button" class="mobile-tab-btn" id="tab-btn-map" onclick="switchMobileView('map')">
      🗺️ Pin on Map
    </button>
  </div>

  <!-- ══════════════════ PAGE BODY ══════════════════ -->
  <main id="student-main">

    <!-- Left: Report Form Sidebar -->
    <aside id="report-sidebar">

      <div class="sidebar-title">
        <span>📋</span>
        <div>
          <h2>Submit Issue</h2>
          <p>Tap map to pin location, describe problem, and attach photo.</p>
        </div>
      </div>

      <!-- Alert notification box -->
      <div id="report-alert" role="alert" aria-live="assertive"></div>

      <!-- Main Submission Form -->
      <form id="issue-report-form" novalidate aria-label="Campus issue report form">

        <!-- Hidden coordinates calculated from 2D blueprint map -->
        <input type="hidden" id="report-lat" name="latitude" />
        <input type="hidden" id="report-lng" name="longitude" />

        <!-- Pinned Location Status Card -->
        <div class="pin-display" id="pin-display" onclick="handlePinDisplayClick()" title="Tap to select location on map">
          <span style="font-size:18px;">📍</span>
          <span id="coords-text">Tap map to pin location</span>
        </div>

        <!-- Issue Type Dropdown -->
        <div class="form-group">
          <label class="form-label" for="issue-type">
            🔧 Category <span class="required">*</span>
          </label>
          <select id="issue-type" name="issue_type" class="form-control" required style="color:#000000 !important; background-color:#ffffff !important;">
            <option value="" disabled selected>Select category</option>
            <option value="IT / PC &amp; Network">💻 IT / PC &amp; Network</option>
            <option value="Electrical">⚡ Electrical</option>
            <option value="Plumbing">🚿 Plumbing</option>
            <option value="Aircon / HVAC">❄️ Aircon / HVAC</option>
            <option value="Furniture / Civil">🪑 Furniture / Civil</option>
          </select>
        </div>

        <!-- Location Description -->
        <div class="form-group">
          <label class="form-label" for="location-text">
            📍 Location <span class="required">*</span>
          </label>
          <input id="location-text" name="location_text" type="text" class="form-control"
                 placeholder="Room / Floor (e.g. CEA 302)" required style="color:#000000 !important; background-color:#ffffff !important; caret-color:#000000 !important; font-weight:600;" />
        </div>

        <!-- Problem Description -->
        <div class="form-group">
          <label class="form-label" for="issue-description">
            📝 Description <span class="required">*</span>
          </label>
          <textarea id="issue-description" name="description" class="form-control"
                    placeholder="Describe the issue..."
                    required rows="3" style="color:#000000 !important; background-color:#ffffff !important; caret-color:#000000 !important; font-weight:500;"></textarea>
        </div>

        <!-- Preferred Technician -->
        <div class="form-group">
          <label class="form-label" for="preferred-tech">👷 Tech (Optional)</label>
          <select id="preferred-tech" name="preferred_tech" class="form-control" style="color:#000000 !important; background-color:#ffffff !important;">
            <option value="All">Auto-assign</option>
            <option value="MIS Technician">🖥️ MIS Technician</option>
            <option value="Electrician">⚡ Electrician</option>
            <option value="Plumber">🔧 Plumber</option>
            <option value="HVAC Tech">❄️ HVAC Tech</option>
            <option value="General Maintenance">🛠️ General Maintenance</option>
          </select>
        </div>

        <!-- Photo Upload Zone (REQUIRED for report validation) -->
        <div class="form-group">
          <label class="form-label">📷 Photo Proof <span class="required">*</span></label>
          <div class="photo-upload-zone" id="photo-drop-zone">
            <label class="photo-upload-label" for="photo-input">
              <span class="upload-icon" aria-hidden="true">📸</span>
              <span>Tap to upload photo</span>
            </label>
            <input id="photo-input" name="photo" type="file" accept="image/*" required />
          </div>
          <div id="photo-preview-container" aria-label="Photo preview">
            <img id="photo-preview-img" src="" alt="Preview" title="Click to enlarge" />
            <span id="photo-file-name"></span>
            <button type="button" id="btn-remove-photo" aria-label="Remove photo">✕ Remove</button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit-report">
          <span class="btn-icon" aria-hidden="true">🚀</span>
          <span class="btn-label">Submit Report</span>
        </button>

      </form>
    </aside>

    <!-- Right: Authentic 2D Interactive Blueprint Campus Map -->
    <section id="map-panel" style="flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden;">
      <div id="report-map" style="width:100%;height:100%;"></div>
    </section>

  </main>

</div><!-- /app-shell -->

<!-- Photo Lightbox Modal -->
<div id="image-modal" role="dialog" aria-modal="true" aria-label="Photo lightbox" onclick="closeImageModal()">
  <img id="image-modal-src" src="" alt="Full-size photo" />
</div>

<!-- Interactive 2D Blueprint Engine & Student Portal Scripts -->
<script src="campus-map-2d.js?v=5"></script>
<script src="student-portal.js?v=5"></script>

</body>
</html>
